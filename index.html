<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Kanak 🌹</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  height:100vh;
  background:url("background.jpg") center/cover no-repeat;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  overflow:hidden;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
}

.card{
  position:relative;
  z-index:5;
  max-width:340px;
  margin:auto;
  top:50%;
  transform:translateY(-50%);
  background:rgba(255,255,255,0.95);
  padding:28px 24px;
  border-radius:26px;
  text-align:center;
  box-shadow:0 25px 45px rgba(0,0,0,0.4);
}

h1{
  color:#c2185b;
  margin-bottom:8px;
}

#status{
  font-size:13px;
  color:#888;
  margin-bottom:10px;
}

#msg{
  min-height:90px;
  font-size:15px;
  color:#444;
  line-height:1.6;
}

button{
  margin-top:18px;
  padding:12px 22px;
  border:none;
  border-radius:22px;
  background:#ff2f7a;
  color:white;
  font-size:14px;
  cursor:pointer;
  position:relative;
  z-index:10;
}

button:active{
  transform:scale(0.95);
}

/* big rose animation */
.big-rose{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:120px;
  z-index:20;
  animation:pop 1.5s ease forwards;
}

@keyframes pop{
  0%{transform:scale(0);opacity:0;}
  40%{transform:scale(1.3);opacity:1;}
  100%{transform:scale(1);opacity:0;}
}

/* falling roses */
.rose{
  position:fixed;
  top:-50px;
  font-size:22px;
  animation:fall linear infinite;
  z-index:2;
}

@keyframes fall{
  to{transform:translateY(110vh) rotate(360deg);}
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="card">
  <h1>Hey Kanak 🌹</h1>

  <div id="status">Tap the rose to start 💗</div>

  <p id="msg"></p>

  <button onclick="openRose()">Tap to Open a Rose 🌹</button>
</div>

<script>
const lines=[
  "Message started… 💫",
  "Tumhari smile ka effect bohot strong hai 😌",
  "Rose Day sirf ek bahana hai 🌹",
  "Tum ho to har din special lagta hai 💖",
  "Bas itna hi kehna tha…",
  "Tum bohot cute ho ❤️"
];

let lineIndex=0;
let charIndex=0;

function typeLine(){
  if(charIndex < lines[lineIndex].length){
    document.getElementById("msg").innerHTML += lines[lineIndex].charAt(charIndex);
    charIndex++;
    setTimeout(typeLine,40);
  }else{
    document.getElementById("msg").innerHTML += "<br><br>";
    charIndex=0;
    lineIndex++;
    if(lineIndex < lines.length){
      setTimeout(typeLine,400);
    }else{
      document.getElementById("status").innerText="Message ended 🌹";
    }
  }
}

function openRose(){
  document.getElementById("msg").innerHTML="";
  document.getElementById("status").innerText="Opening rose… 🌹";
  lineIndex=0;
  charIndex=0;

  const r=document.createElement("div");
  r.className="big-rose";
  r.innerText="🌹";
  document.body.appendChild(r);
  setTimeout(()=>r.remove(),1500);

  setTimeout(typeLine,800);
}

/* background rose rain */
setInterval(()=>{
  const r=document.createElement("div");
  r.className="rose";
  r.innerText="🌹";
  r.style.left=Math.random()*100+"vw";
  r.style.animationDuration=3+Math.random()*4+"s";
  document.body.appendChild(r);
  setTimeout(()=>r.remove(),7000);
},300);
</script>

</body>
</html>
