<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Kanak 🌹</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  height:100vh;
  background:url("background.jpg") center/cover no-repeat;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  overflow:hidden;
}

/* dark overlay */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.45);
}

/* main card */
.card{
  position:relative;
  z-index:10;
  max-width:330px;
  margin:auto;
  top:50%;
  transform:translateY(-50%);
  background:rgba(255,255,255,0.93);
  padding:28px 24px;
  border-radius:24px;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,0.4);
  animation:breathe 4s ease-in-out infinite;
}

@keyframes breathe{
  0%,100%{transform:translateY(-50%) scale(1);}
  50%{transform:translateY(-50%) scale(1.03);}
}

/* heading glow */
h1{
  color:#c2185b;
  margin-bottom:10px;
  animation:glow 2s ease-in-out infinite alternate;
}

@keyframes glow{
  from{text-shadow:0 0 5px #ff5f9e;}
  to{text-shadow:0 0 15px #ff2f7a;}
}

p{
  font-size:15px;
  color:#444;
  line-height:1.6;
}

/* button */
button{
  margin-top:14px;
  padding:10px 20px;
  border:none;
  border-radius:20px;
  background:#ff2f7a;
  color:white;
  font-size:14px;
  cursor:pointer;
  box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

button:hover{
  background:#e91e63;
}

/* falling roses */
.rose{
  position:fixed;
  top:-50px;
  font-size:22px;
  animation:fall linear infinite;
  z-index:2;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(360deg);
  }
}

/* floating hearts */
.heart{
  position:fixed;
  bottom:-20px;
  font-size:18px;
  animation:floatUp linear infinite;
  z-index:3;
}

@keyframes floatUp{
  to{
    transform:translateY(-110vh) scale(1.5);
    opacity:0;
  }
}

/* bottom vibe text */
.bg-text{
  position:fixed;
  bottom:12px;
  width:100%;
  text-align:center;
  color:white;
  font-size:13px;
  opacity:0.85;
  z-index:4;
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="card">
  <h1>Hey Kanak 🌹</h1>

  <p id="msg">
    Kabutar 🕊️<br>
    Aaj Rose Day hai 🌹<br>
    aur tum smile karti ho to<br>
    din khud special ban jata hai ✨
    <br><br>
    — Saksham
  </p>

  <button onclick="changeMsg()">Tap for Surprise 💖</button>
</div>

<div class="bg-text">
  🌹 Love • Smiles • Games • Late Night Talks • Us 🌹
</div>

<script>
/* rose rain */
function createRose(){
  const r=document.createElement("div");
  r.className="rose";
  r.innerText="🌹";
  r.style.left=Math.random()*100+"vw";
  r.style.animationDuration=3+Math.random()*4+"s";
  document.body.appendChild(r);
  setTimeout(()=>r.remove(),7000);
}
setInterval(createRose,280);

/* floating hearts */
function createHeart(){
  const h=document.createElement("div");
  h.className="heart";
  h.innerText="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=4+Math.random()*3+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),7000);
}
setInterval(createHeart,600);

/* surprise messages */
const messages=[
  "Tumhari ek smile poora din bana deti hai 💫",
  "Agar rose tum hoti to kabhi murjhati hi nahi 🌹",
  "Tum ho to sab simple cheezein special lagti hain 💖",
  "Ye website nahi, thoda sa dil hai ❤️",
  "Bas itna hi kehna tha… tum bohot cute ho 😌"
];

let i=0;
function changeMsg(){
  document.getElementById("msg").innerHTML=messages[i];
  i=(i+1)%messages.length;
}
</script>

</body>
</html>
