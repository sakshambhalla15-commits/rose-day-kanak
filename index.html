<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rose Day for Kanak 🌹</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: url("background.jpg") no-repeat center center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.85);
      padding: 30px 35px;
      border-radius: 20px;
      text-align: center;
      max-width: 350px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      animation: fadeIn 2s ease;
    }

    h1 {
      color: #c2185b;
      margin-bottom: 10px;
    }

    p {
      font-size: 16px;
      color: #444;
      margin-bottom: 20px;
    }

    button {
      background: #e91e63;
      border: none;
      color: white;
      padding: 12px 22px;
      font-size: 16px;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #c2185b;
      transform: scale(1.05);
    }

    .hidden {
      display: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Happy Rose Day 🌹</h1>
    <p>
      Kanak 💖 <br><br>
      Kabutar, ye chhota sa surprise sirf tumhare liye.  
      Click karo… aur bas feel karo.
    </p>

    <button id="playBtn">Click here Kabutar 🕊️💗</button>
  </div>

  <audio id="bgMusic">
    <source src="shubh-love.mp3" type="audio/mpeg">
  </audio>

  <script>
    const btn = document.getElementById("playBtn");
    const music = document.getElementById("bgMusic");

    btn.addEventListener("click", () => {
      music.play();
      btn.innerText = "Playing for you 💖🎶";
      btn.disabled = true;
    });
  </script>

</body>
</html>
