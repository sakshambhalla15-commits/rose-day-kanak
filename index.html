<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hey Kanak 🌹</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
  height:100vh;
  background:url("background.jpg") center/cover no-repeat fixed;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.88);
  padding:28px 24px;
  border-radius:22px;
  text-align:center;
  max-width:330px;
  box-shadow:0 20px 40px rgba(0,0,0,0.35);
  animation:fadeIn 1.2s ease;
  z-index:5;
}

h1{
  color:#d81b60;
  margin-bottom:12px;
}

p{
  color:#444;
  font-size:15px;
  line-height:1.6;
}

button{
  margin-top:18px;
  padding:12px 22px;
  border:none;
  border-radius:25px;
  background:#d81b60;
  color:white;
  font-size:15px;
  cursor:pointer;
  box-shadow:0 8px 18px rgba(216,27,96,0.4);
}

button:hover{
  transform:scale(1.05);
}

/* MESSAGE */
.message{
  display:none;
  margin-top:14px;
  animation:fadeIn 1s ease;
}

/* BIG ROSE */
.rose{
  font-size:80px;
  animation:pulse 1.4s infinite;
}

/* FLOWERS FALL */
.flower{
  position:fixed;
  top:-40px;
  font-size:26px;
  animation:fall linear infinite;
  z-index:1;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(360deg);
  }
}

@keyframes fadeIn{
  from{opacity:0; transform:scale(0.9);}
  to{opacity:1; transform:scale(1);}
}

@keyframes pulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.15);}
}
</style>
</head>

<body>

<div class="card">
  <h1>Hey Kanak 🌹</h1>
  <p>
    Kabutar 🕊️<br>
    Ek chhota sa message hai<br>
    jo dil se likha gaya hai 💖
  </p>

  <button onclick="showSurprise()">Tap for a Smile 💌</button>

  <div class="message" id="msg">
    <p>
      Har rose tumhari smile jaisa ho 🌹<br>
      Har moment tumhare saath special lage ✨<br>
      Aaj nahi, hamesha ❤️
    </p>
    <div class="rose">🌹</div>
    <p>— Saksham</p>
  </div>
</div>

<script>
function showSurprise(){
  document.getElementById("msg").style.display="block";
  createFlowers();
}

function createFlowers(){
  for(let i=0;i<25;i++){
    let f=document.createElement("div");
    f.className="flower";
    f.innerHTML=["🌸","🌹","🌺","💐"][Math.floor(Math.random()*4)];
    f.style.left=Math.random()*100+"vw";
    f.style.animationDuration=4+Math.random()*4+"s";
    document.body.appendChild(f);
    setTimeout(()=>f.remove(),9000);
  }
}
</script>

</body>
</html>
